version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=production
      # SQLite will store the database file in your project directory
      - DATABASE_URL=sqlite:///./sql_app.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000